<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VUCA weather report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{
  --bg:#EAF1FB; --bg2:#DCE8FA; --surface:#FFFFFF; --ink:#051938; --muted:#47608A; --line:#C0D1EC;
  --primary:#1F5FD0; --on-primary:#FFFFFF; --accent:#0A6E9C; --soft:#D5E3F9;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#051938; --bg2:#0A2A63; --surface:#0C2A5C; --ink:#FFFFFF; --muted:#A9BEE0; --line:#2B4C8A;
    --primary:#4D88E8; --on-primary:#051938; --accent:#37C9EF; --soft:#0F3374;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#051938; --bg2:#0A2A63; --surface:#0C2A5C; --ink:#FFFFFF; --muted:#A9BEE0; --line:#2B4C8A;
  --primary:#4D88E8; --on-primary:#051938; --accent:#37C9EF; --soft:#0F3374;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background-image:linear-gradient(120deg,var(--bg),var(--bg2));color:var(--ink);
  font:400 1.125rem/1.45 Barlow,"Segoe UI",Arial,sans-serif}
.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
.wrap{max-width:1840px;margin:0 auto;padding:clamp(14px,2vw,36px)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.top{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:flex-end;margin-bottom:clamp(14px,2vw,28px)}
h1,h2{margin:0}
h1{font:700 clamp(2.1rem,4.4vw,4.6rem)/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;max-width:24ch}
.hint{margin:10px 0 0;color:var(--muted);font-size:clamp(1rem,1.4vw,1.35rem);max-width:60ch}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:.8em 1.2em;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;line-height:1}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-size:1.25rem;padding:1em 1.5em}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.2vw,20px)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.open{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.open:hover .name{color:var(--primary)}
.art{aspect-ratio:5/6;overflow:hidden;background:#0B1D45}
.art svg,.stage svg{display:block;width:100%;height:100%}
.name{display:block;padding:12px 16px 4px;font:700 clamp(1.6rem,2.3vw,2.5rem)/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.tally{display:flex;align-items:center;gap:10px;padding:8px 14px 14px}
.tally button{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font:700 1.5rem/1 Barlow,Arial,sans-serif;cursor:pointer}
.tally button:hover{border-color:var(--primary);color:var(--primary)}
.tally output{flex:none;min-width:2ch;text-align:center;font:700 2rem/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.bar{flex:1;min-width:30px;height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .35s ease}

.focus{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(16px,2.4vw,44px);align-items:start}
.left{min-width:0}
.stage{border-radius:30px;overflow:hidden;aspect-ratio:16/10;border:2px solid var(--line);background:#0B1D45}
.panel{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,22px)}
.wname{font:800 clamp(3rem,5.6vw,5.6rem)/.9 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.ask{margin:0;font-size:clamp(1.2rem,1.8vw,1.8rem);line-height:1.25;max-width:30ch}
.reveal{background:var(--soft);border-radius:18px;padding:clamp(14px,1.6vw,26px)}
.vword{margin:0;font:700 clamp(2.4rem,4.4vw,4.4rem)/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--accent)}
.mean{margin:8px 0 0;font-size:clamp(1.1rem,1.6vw,1.6rem);line-height:1.3}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:14px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:700 clamp(1.5rem,2.3vw,2.4rem)/1.1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;transition:opacity .4s,background .4s}
.tile small{display:block;margin-top:8px;font:400 clamp(.95rem,1.25vw,1.2rem)/1.3 Barlow,Arial,sans-serif}
.tile.lit{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tile.dim{opacity:.3}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.pop{animation:pop .5s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:clamp(12px,1.4vw,20px)}
.chip{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.chip.sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary)}
.chip .art{aspect-ratio:16/8}
.chip .name{font-size:clamp(1.1rem,1.5vw,1.6rem);padding:6px 8px 0}
.chip .tally{padding:4px 6px 8px;gap:4px;justify-content:center}
.chip .bar{display:none}
.chip .tally{margin-top:auto}
.chip .tally button{width:32px;height:32px;font-size:1.1rem}
.chip .tally output{font-size:1.4rem}

.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden;padding-right:18px}
.row .art{aspect-ratio:16/6}
.row b{font:700 clamp(1.5rem,2.6vw,2.6rem)/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.row .head{display:flex;flex-direction:column;gap:6px}
.row .head span{font:700 clamp(1.2rem,2vw,2rem)/1.1 Barlow,Arial,sans-serif;color:var(--accent)}

@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .focus{grid-template-columns:1fr}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:1fr 1fr;padding:0 0 12px 0}
  .row .art{grid-column:1/-1}
  .row b{padding-left:16px}
}

/* ---------- weather scenes ---------- */
.sc *{transform-box:view-box}
.drift{animation:drift 10s ease-in-out infinite alternate}
.drift.r{animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(calc(var(--dx,26px) * -1))}to{transform:translateX(var(--dx,26px))}}
.rain{opacity:.8;animation:rain 1.1s linear infinite}
@keyframes rain{from{transform:translate(0,-90px)}to{transform:translate(-64px,520px)}}
.bolt{opacity:0;animation:bolt 4.2s linear infinite}
@keyframes bolt{0%,82%,100%{opacity:0}84%{opacity:1}86%{opacity:.1}92%{opacity:1}96%{opacity:0}}
.flash{opacity:0;animation:flash 4.2s linear infinite}
@keyframes flash{0%,82%,100%{opacity:0}84%{opacity:.2}86%{opacity:0}92%{opacity:.16}96%{opacity:0}}
.fog{animation:fog 16s ease-in-out infinite alternate}
.fog.r{animation-direction:alternate-reverse}
@keyframes fog{from{transform:translateX(-150px)}to{transform:translateX(150px)}}
.bld{animation:bld 8s ease-in-out infinite alternate}
@keyframes bld{from{opacity:.95}to{opacity:.3}}
.streak{fill:none;stroke:#fff;stroke-linecap:round;stroke-dasharray:240 1400;animation:dash 3.2s linear infinite}
@keyframes dash{from{stroke-dashoffset:1570}to{stroke-dashoffset:0}}
.swirl{fill:none;stroke:#7FE3FF;stroke-width:7;stroke-linecap:round;stroke-dasharray:150 420;transform-origin:400px 250px;animation:spin 7s linear infinite}
.swirl.r{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{animation:spin 60s linear infinite}
.halo{animation:breathe 6s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(.92)}to{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){
  .sc *,.pop{animation:none!important}
  .bolt{opacity:.9}
}
</style>
</head>
<body>
<div class="wrap"><main id="app" aria-live="off"></main></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var KINDS = ['storm', 'fog', 'wind', 'mixed', 'clear'];
  var DATA = {
    storm: { name: 'Storm', alt: 'Animated storm with rain and lightning', vuca: 'Volatility',
      meaning: 'Change that is fast, intense and hard to predict.',
      ask: 'Who picked the storm? What changed so fast in your work?',
      prime: 'Vision', line: 'A clear vision keeps decisions pointed one way while everything shakes.' },
    fog: { name: 'Fog', alt: 'Animated fog drifting over city buildings', vuca: 'Uncertainty',
      meaning: 'You can’t see what is coming, so outcomes are unclear.',
      ask: 'What can’t you see ahead right now?',
      prime: 'Understanding', line: 'Keep learning, plan scenarios and watch the trends to see further.' },
    wind: { name: 'Crosswinds', alt: 'Animated winds blowing from different directions', vuca: 'Complexity',
      meaning: 'Many connected forces pull at the same time.',
      ask: 'Which forces are pulling on your team at once?',
      prime: 'Clarity', line: 'Simplify, communicate clearly and focus on what matters most.' },
    mixed: { name: 'Mixed clouds', alt: 'Animated sun partly hidden by moving clouds', vuca: 'Ambiguity',
      meaning: 'The signs are there, but everyone reads them differently.',
      ask: 'Where do people on your team read the same situation differently?',
      prime: 'Agility', line: 'Experiment, adapt quickly and pivot when the picture changes.' },
    clear: { name: 'Clear skies', alt: 'Animated sun in a clear sky', vuca: null, noVuca: 'No VUCA today',
      meaning: 'Calm now doesn’t mean calm for long.',
      ask: 'Is it really clear, or only clear from where you stand?',
      prime: null, line: 'Calm is the time to build all four before the weather turns.' }
  };
  var PRIME = ['Vision', 'Understanding', 'Clarity', 'Agility'];
  var state = { view: 'home', sel: null, step: 0, counts: { storm: 0, fog: 0, wind: 0, mixed: 0, clear: 0 } };
  var uid = 0;

  /* ---------- scenes ---------- */
  function cloud(fill) {
    return '<circle cx="-60" cy="0" r="38" fill="' + fill + '"/><circle cx="-8" cy="-28" r="52" fill="' + fill + '"/>' +
      '<circle cx="52" cy="-4" r="42" fill="' + fill + '"/><rect x="-98" y="-2" width="190" height="40" rx="20" fill="' + fill + '"/>';
  }
  function sky(id, a, b) {
    return '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a +
      '"/><stop offset="1" stop-color="' + b + '"/></linearGradient></defs><rect width="800" height="500" fill="url(#' + id + ')"/>';
  }
  function scene(kind) {
    var u = ++uid, id = 'sk' + u, s = '', i;
    if (kind === 'storm') {
      s += sky(id, '#070F2B', '#24437F') + '<rect class="flash" width="800" height="500" fill="#DDF1FF"/>';
      for (i = 0; i < 44; i++) {
        var x = (i * 41) % 840, y = (i * 83) % 360;
        s += '<line class="rain" style="animation-duration:' + (0.9 + (i % 5) * 0.12).toFixed(2) + 's;animation-delay:-' + ((i * 0.37) % 1.4).toFixed(2) +
          's" x1="' + x + '" y1="' + y + '" x2="' + (x - 14) + '" y2="' + (y + 42) + '" stroke="#B9D7FF" stroke-width="4" stroke-linecap="round"/>';
      }
      s += '<g transform="translate(260 120) scale(1.6)"><g class="drift" style="animation-duration:9s">' + cloud('#2C416E') + '</g></g>' +
        '<g transform="translate(560 90) scale(1.3)"><g class="drift r" style="animation-duration:12s">' + cloud('#1E3158') + '</g></g>' +
        '<polygon class="bolt" points="420,190 378,300 416,300 384,410 462,268 426,268 452,190" fill="#EAF7FF"/>';
    } else if (kind === 'fog') {
      s += sky(id, '#3B5C8C', '#A9BED8') +
        '<defs><linearGradient id="fg' + u + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2F7FF" stop-opacity="0"/><stop offset=".5" stop-color="#F2F7FF" stop-opacity=".9"/><stop offset="1" stop-color="#F2F7FF" stop-opacity="0"/></linearGradient></defs>' +
        '<circle cx="610" cy="120" r="48" fill="#F3F7FF" opacity=".5"/>' +
        '<g class="bld" fill="#1D3F73"><rect x="60" y="240" width="90" height="260"/><rect x="170" y="200" width="70" height="300"/><rect x="270" y="260" width="110" height="240"/>' +
        '<rect x="420" y="180" width="80" height="320"/><rect x="530" y="250" width="100" height="250"/><rect x="660" y="210" width="90" height="290"/></g>' +
        '<rect class="fog" style="animation-duration:15s" x="-150" y="110" width="1100" height="110" fill="url(#fg' + u + ')"/>' +
        '<rect class="fog r" style="animation-duration:19s" x="-150" y="210" width="1100" height="120" fill="url(#fg' + u + ')"/>' +
        '<rect class="fog" style="animation-duration:23s" x="-150" y="310" width="1100" height="110" fill="url(#fg' + u + ')"/>' +
        '<rect class="fog r" style="animation-duration:17s" x="-150" y="390" width="1100" height="110" fill="url(#fg' + u + ')"/>';
    } else if (kind === 'wind') {
      s += sky(id, '#0B3A86', '#4D88E8');
      var P = [
        ['M-40 110 C160 60 320 170 520 110 S800 80 860 120', 6, 3.2, 0],
        ['M860 230 C650 290 480 180 300 240 S40 270 -40 220', 5, 3.8, 1.1],
        ['M-40 390 C200 340 360 440 560 370 S780 310 860 350', 6, 3.5, 2],
        ['M120 520 C220 400 330 330 470 220 S640 60 700 -20', 4, 4.2, 0.6],
        ['M700 -20 C620 120 520 190 400 300 S220 430 160 520', 4, 3.9, 1.7],
        ['M-40 300 C180 250 340 330 520 280 S760 250 860 290', 5, 3.0, 0.9],
        ['M860 40 C640 10 480 90 300 50 S60 40 -40 70', 5, 3.6, 2.3],
        ['M860 470 C660 420 500 500 320 450 S80 430 -40 460', 4, 3.3, 0.4]
      ];
      for (i = 0; i < P.length; i++) {
        s += '<path class="streak" style="animation-duration:' + P[i][2] + 's;animation-delay:-' + P[i][3] + 's" d="' + P[i][0] + '" stroke-width="' + P[i][1] + '" opacity=".9"/>';
      }
      s += '<circle class="swirl" cx="400" cy="250" r="60"/><circle class="swirl r" style="animation-duration:9s" cx="400" cy="250" r="100"/>' +
        '<circle class="swirl" style="animation-duration:12s" cx="400" cy="250" r="140"/>';
    } else if (kind === 'mixed') {
      s += sky(id, '#2B68CF', '#A8CFFF') + '<circle class="halo" style="transform-origin:500px 170px" cx="500" cy="170" r="118" fill="#FFE08A" opacity=".28"/>' +
        '<g class="rays" style="transform-origin:500px 170px" stroke="#FFD36B" stroke-width="8" stroke-linecap="round">';
      for (i = 0; i < 12; i++) {
        var a = i * Math.PI / 6;
        s += '<line x1="' + (500 + Math.cos(a) * 92).toFixed(1) + '" y1="' + (170 + Math.sin(a) * 92).toFixed(1) +
          '" x2="' + (500 + Math.cos(a) * 124).toFixed(1) + '" y2="' + (170 + Math.sin(a) * 124).toFixed(1) + '"/>';
      }
      s += '</g><circle cx="500" cy="170" r="72" fill="#FFD25A"/>' +
        '<g transform="translate(250 330) scale(1.3)"><g class="drift r" style="animation-duration:17s;--dx:36px">' + cloud('#DCE8F7') + '</g></g>' +
        '<g transform="translate(440 205) scale(1.7)"><g class="drift" style="animation-duration:13s;--dx:46px">' + cloud('#FFFFFF') + '</g></g>' +
        '<g transform="translate(650 350) scale(.9)"><g class="drift" style="animation-duration:15s;--dx:30px">' + cloud('#EEF4FF') + '</g></g>';
    } else {
      s += sky(id, '#0B50BD', '#69B3F7') + '<circle class="halo" style="transform-origin:400px 210px" cx="400" cy="210" r="140" fill="#FFE08A" opacity=".25"/>' +
        '<g class="rays" style="transform-origin:400px 210px" stroke="#FFE08A" stroke-width="9" stroke-linecap="round">';
      for (i = 0; i < 16; i++) {
        var b = i * Math.PI / 8;
        s += '<line x1="' + (400 + Math.cos(b) * 108).toFixed(1) + '" y1="' + (210 + Math.sin(b) * 108).toFixed(1) +
          '" x2="' + (400 + Math.cos(b) * 150).toFixed(1) + '" y2="' + (210 + Math.sin(b) * 150).toFixed(1) + '"/>';
      }
      s += '</g><circle cx="400" cy="210" r="84" fill="#FFD25A"/>' +
        '<path d="M0 420 C150 360 300 400 450 370 S700 360 800 400 V500 H0Z" fill="#0A3F93"/>' +
        '<path d="M0 460 C200 420 380 470 560 440 S740 430 800 450 V500 H0Z" fill="#072C6B"/>';
    }
    return '<svg class="sc" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + DATA[kind].alt + '">' + s + '</svg>';
  }

  /* ---------- views ---------- */
  function tally(k) {
    return '<div class="tally"><button type="button" data-action="minus" data-kind="' + k + '" aria-label="One less ' + DATA[k].name + '">−</button>' +
      '<output data-n="' + k + '" aria-live="polite">0</output>' +
      '<button type="button" data-action="plus" data-kind="' + k + '" aria-label="One more ' + DATA[k].name + '">+</button>' +
      '<div class="bar" aria-hidden="true"><i data-bar="' + k + '"></i></div></div>';
  }
  function homeHTML() {
    var cards = KINDS.map(function (k) {
      return '<article class="card"><button type="button" class="open" data-action="open" data-kind="' + k + '" aria-label="Open ' + DATA[k].name + '">' +
        '<div class="art">' + scene(k) + '</div><span class="name">' + DATA[k].name + '</span></button>' + tally(k) + '</article>';
    }).join('');
    return '<div class="top"><div><h1>If your department were a weather report this week, what would it be?</h1>' +
      '</div>' +
      '<div class="tools"><button type="button" class="btn" data-action="forecast">Full forecast</button>' +
      '<button type="button" class="btn" data-action="reset">Clear tally</button></div></div>' +
      '<div class="grid">' + cards + '</div>';
  }
  function focusHTML() {
    var k = state.sel;
    var chips = KINDS.map(function (c) {
      return '<div class="chip' + (c === k ? ' sel' : '') + '"><button type="button" class="open" data-action="pick" data-kind="' + c + '" aria-label="Switch to ' + DATA[c].name + '">' +
        '<div class="art">' + scene(c) + '</div><span class="name">' + DATA[c].name + '</span></button>' + tally(c) + '</div>';
    }).join('');
    return '<div class="focus"><div class="left"><div class="stage">' + scene(k) + '</div><div class="strip">' + chips + '</div></div>' +
      '<div class="panel" id="panel" aria-live="polite"></div></div>';
  }
  function forecastHTML() {
    var rows;
    // 3-column rows: weather picture, weather name + VUCA word, what we bring
    rows = KINDS.map(function (k) {
      var d = DATA[k];
      return '<div class="row"><div class="art">' + scene(k) + '</div>' +
        '<div class="head"><b>' + d.name + '</b><span>' + (d.vuca || 'No VUCA today') + '</span></div>' +
        '<b>' + (d.prime || 'All four') + '</b></div>';
    }).join('');
    return '<div class="top"><div><h1>The full forecast</h1><p class="hint">Each kind of weather and what we bring into it.</p></div>' +
      '<div class="tools"><button type="button" class="btn primary" data-action="home">All forecasts</button></div></div>' +
      '<div class="rows">' + rows + '</div>';
  }
  function panelHTML() {
    var k = state.sel, d = DATA[k], s = state.step, h;
    h = '<h2 class="wname' + '">' + d.name + '</h2><p class="ask' + (s === 0 ? ' pop' : '') + '">' + d.ask + '</p>';
    if (s >= 1) h += '<div class="reveal' + (s === 1 ? ' pop' : '') + '"><p class="vword">' + (d.vuca || d.noVuca) + '</p><p class="mean">' + d.meaning + '</p></div>';
    if (s >= 2) {
      h += '<p class="ask' + (s === 2 ? ' pop' : '') + '">Which one would you bring into this weather?</p><div class="tiles' + (s === 2 ? ' pop' : '') + '">';
      PRIME.forEach(function (p) {
        var cls = '', extra = '';
        if (s === 3) {
          if (d.prime === null) cls = ' lit';
          else if (d.prime === p) { cls = ' lit'; extra = '<small>' + d.line + '</small>'; } else cls = ' dim';
        }
        h += '<div class="tile' + cls + '">' + p + extra + '</div>';
      });
      h += '</div>';
      if (s === 3 && d.prime === null) h += '<p class="ask pop">' + d.line + '</p>';
    }
    var labels = ['Reveal the VUCA word', 'What would you bring?', 'Reveal the match', 'All forecasts'];
    h += '<div class="nav"><button type="button" class="btn" data-action="prev">' + (s === 0 ? 'All forecasts' : 'Back') + '</button>' +
      '<button type="button" class="btn primary" data-action="next">' + labels[s] + '</button></div>';
    return h;
  }

  /* ---------- state ---------- */
  function updateTally() {
    var max = 1, k;
    for (k in state.counts) max = Math.max(max, state.counts[k]);
    Array.prototype.forEach.call(app.querySelectorAll('[data-n]'), function (o) { o.textContent = state.counts[o.getAttribute('data-n')]; });
    Array.prototype.forEach.call(app.querySelectorAll('[data-bar]'), function (i) {
      i.style.width = (state.counts[i.getAttribute('data-bar')] / max * 100) + '%';
    });
  }
  function renderPanel() {
    var p = document.getElementById('panel');
    if (p) p.innerHTML = panelHTML();
  }
  function render() {
    uid = 0;
    app.innerHTML = state.view === 'home' ? homeHTML() : state.view === 'focus' ? focusHTML() : forecastHTML();
    if (state.view === 'focus') renderPanel();
    updateTally();
  }
  function go(view, k, step) {
    state.view = view; state.sel = k || null; state.step = step || 0;
    render();
    window.scrollTo(0, 0);
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-action]');
    if (!b) return;
    var a = b.getAttribute('data-action'), k = b.getAttribute('data-kind');
    if (a === 'open' || a === 'pick') go('focus', k);
    else if (a === 'plus') { state.counts[k]++; updateTally(); }
    else if (a === 'minus') { state.counts[k] = Math.max(0, state.counts[k] - 1); updateTally(); }
    else if (a === 'home') go('home');
    else if (a === 'forecast') go('forecast');
    else if (a === 'reset') { KINDS.forEach(function (x) { state.counts[x] = 0; }); updateTally(); }
    else if (a === 'next') { if (state.step < 3) { state.step++; renderPanel(); } else go('home'); }
    else if (a === 'prev') { if (state.step > 0) { state.step--; renderPanel(); } else go('home'); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 5) { go('focus', KINDS[n - 1]); return; }
    if (state.view !== 'focus') { if (e.key === 'Escape') go('home'); return; }
    if (e.key === 'ArrowRight') { if (state.step < 3) { state.step++; renderPanel(); } }
    else if (e.key === 'ArrowLeft') { if (state.step > 0) { state.step--; renderPanel(); } }
    else if (e.key === 'Escape') go('home');
  });

  // optional deep links: #storm, #fog-2, #forecast
  var m = /^#(storm|fog|wind|mixed|clear|forecast)(?:-([0-3]))?$/.exec(location.hash);
  if (m && m[1] === 'forecast') go('forecast');
  else if (m) go('focus', m[1], m[2] ? parseInt(m[2], 10) : 0);
  else render();
})();
</script>
</body>
</html>
